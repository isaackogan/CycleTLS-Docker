name: Publish to Docker Hub

on:
  workflow_dispatch:
    inputs:
      cycletls_ref:
        description: "CycleTLS git ref (commit hash, tag, or branch) to build against"
        required: true
        type: string

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for local testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cycletls-docker:e2e
          build-args: |
            CYCLETLS_REF=${{ inputs.cycletls_ref }}

      - name: Run container
        run: |
          docker run -d --rm -p 127.0.0.1:9112:9112 --name cycletls-e2e cycletls-docker:e2e

      - name: Run E2E test
        working-directory: ./test
        env:
          CYCLETLS_WS_URL: ws://127.0.0.1:9112/
        run: go test -v ./...

      - name: Stop container
        if: always()
        run: docker stop cycletls-e2e || true

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: isaackogan/cycletls-docker:${{ inputs.cycletls_ref }}
          build-args: |
            CYCLETLS_REF=${{ inputs.cycletls_ref }}
